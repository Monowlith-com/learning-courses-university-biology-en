<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Example UPGMA tree</title><desc id="desc">A and B join at 0.05, C at 0.15.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Example UPGMA tree</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<path d="M 170 490 L 820 490" fill="none" stroke="#687681" stroke-width="2"/>
<text x="495" y="565" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">Height (distance)</text>
<path d="M 200 145 L 200 490" fill="none" stroke="#dce2e2" stroke-width="1"/>
<text x="200" y="525" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">0.15</text>
<path d="M 600 145 L 600 490" fill="none" stroke="#dce2e2" stroke-width="1"/>
<text x="600" y="525" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">0.05</text>
<path d="M 800 145 L 800 490" fill="none" stroke="#dce2e2" stroke-width="1"/>
<text x="800" y="525" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">0</text>
<path d="M 200 260 L 200 420" fill="none" stroke="#347c86" stroke-width="4"/>
<path d="M 200 260 L 600 260" fill="none" stroke="#347c86" stroke-width="4"/>
<path d="M 600 180 L 600 340" fill="none" stroke="#347c86" stroke-width="4"/>
<path d="M 600 180 L 800 180" fill="none" stroke="#347c86" stroke-width="4"/>
<path d="M 600 340 L 800 340" fill="none" stroke="#347c86" stroke-width="4"/>
<path d="M 200 420 L 800 420" fill="none" stroke="#347c86" stroke-width="4"/>
<text x="840" y="187" font-family="Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="middle" fill="#23313e">A</text>
<text x="840" y="347" font-family="Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="middle" fill="#23313e">B</text>
<text x="840" y="427" font-family="Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="middle" fill="#23313e">C</text>
<text x="200" y="225" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">Root</text>
<text x="600" y="150" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">Cluster A–B</text>
</svg>
