<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Tinbergen’s four questions</title><desc id="desc">Four complementary explanatory levels grouped into proximate and evolutionary questions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Tinbergen’s four questions</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="45" y="125" width="410" height="65" rx="8" fill="#e1edf4" stroke="#6c7e80" stroke-width="2"/>
<text x="250" y="165" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#23313e">Proximate explanations</text>
<rect x="45" y="220" width="410" height="110" rx="8" fill="#e7f2ef" stroke="#6c7e80" stroke-width="2"/>
<text x="250" y="262" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#23313e">Mechanism</text>
<text x="250" y="299" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Current triggers</text>
<rect x="45" y="365" width="410" height="110" rx="8" fill="#e7f2ef" stroke="#6c7e80" stroke-width="2"/>
<text x="250" y="407" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#23313e">Ontogeny</text>
<text x="250" y="444" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Individual development</text>
<rect x="505" y="125" width="410" height="65" rx="8" fill="#e1edf4" stroke="#6c7e80" stroke-width="2"/>
<text x="710" y="165" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#23313e">Ultimate explanations</text>
<rect x="505" y="220" width="410" height="110" rx="8" fill="#e7f2ef" stroke="#6c7e80" stroke-width="2"/>
<text x="710" y="262" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#23313e">Function</text>
<text x="710" y="299" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Fitness consequences</text>
<rect x="505" y="365" width="410" height="110" rx="8" fill="#e7f2ef" stroke="#6c7e80" stroke-width="2"/>
<text x="710" y="407" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#23313e">Evolution</text>
<text x="710" y="444" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Phylogenetic history</text>
</svg>
