<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Great ape relationships</title><desc id="desc">Reduced genus-level tree of living Hominidae with Pan and Homo as sister lineages.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Great ape relationships</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<text x="80" y="145" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="start" fill="#23313e">Hominidae</text>
<path d="M 110 335 L 260 335" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 260 165 L 260 400" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 260 165 L 640 165" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 260 400 L 390 400" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 390 270 L 390 465" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 390 270 L 640 270" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 390 465 L 520 465" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 520 375 L 520 500" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 520 375 L 640 375" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 520 500 L 640 500" fill="none" stroke="#687681" stroke-width="2"/>
<text x="650" y="173" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#23313e">Pongo (orangutans)</text>
<text x="650" y="278" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#23313e">Gorilla</text>
<text x="650" y="383" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#23313e">Pan (chimpanzees, bonobos)</text>
<text x="650" y="508" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#23313e">Homo (humans)</text>
