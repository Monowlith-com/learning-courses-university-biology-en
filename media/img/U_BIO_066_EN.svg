<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Early development and germ layers</title><desc id="desc">Zygote and cleavage stage followed by three schematic germ layers with example derivatives.</desc>
