<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Alternation of generations</title><desc id="desc">Meiosis produces spores; fertilisation unites gametes into a zygote.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Alternation of generations</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="370" y="112" width="220" height="60" rx="8" fill="#e5eeef" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="149" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Sporophyte (2n)</text>
<rect x="680" y="250" width="220" height="60" rx="8" fill="#f5e7d8" stroke="#6c7e80" stroke-width="2"/>
<text x="790" y="287" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Spores (n)</text>
<rect x="540" y="435" width="220" height="60" rx="8" fill="#f5e7d8" stroke="#6c7e80" stroke-width="2"/>
<text x="650" y="472" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Gametophyte (n)</text>
<rect x="200" y="435" width="220" height="60" rx="8" fill="#f5e7d8" stroke="#6c7e80" stroke-width="2"/>
<text x="310" y="472" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Gametes (n)</text>
<rect x="60" y="250" width="220" height="60" rx="8" fill="#e5eeef" stroke="#6c7e80" stroke-width="2"/>
<text x="170" y="287" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Zygote (2n)</text>
<path d="M 590 150 L 680 254" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="670" y="179" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Meiosis</text>
<path d="M 790 310 L 714 435" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="827" y="380" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Mitosis</text>
<path d="M 540 465 L 420 465" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="445" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Mitosis</text>
<path d="M 245 435 L 170 310" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="150" y="394" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Fertilisation</text>
<path d="M 280 254 L 370 150" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="263" y="178" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Mitosis</text>
</svg>
