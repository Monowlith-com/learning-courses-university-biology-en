<text x="115" y="412.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="end" fill="#23313e">2</text>
<path d="M 130 345.0 L 870 345.0" fill="none" stroke="#dce2e2" stroke-width="1"/>
<text x="115" y="352.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="end" fill="#23313e">4</text>
<path d="M 130 285.0 L 870 285.0" fill="none" stroke="#dce2e2" stroke-width="1"/>
<text x="115" y="292.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="end" fill="#23313e">6</text>
<path d="M 130 225.0 L 870 225.0" fill="none" stroke="#dce2e2" stroke-width="1"/>
<text x="115" y="232.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="end" fill="#23313e">8</text>
<path d="M 130 165.0 L 870 165.0" fill="none" stroke="#dce2e2" stroke-width="1"/>
<text x="115" y="172.0" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="end" fill="#23313e">10</text>
<rect x="210" y="345.0" width="105" height="120.0" fill="#347c86"/>
<text x="262" y="335.0" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">4</text>
<rect x="335" y="255.0" width="105" height="210.0" fill="#a45b27"/>
<text x="387" y="245.0" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">7</text>
<text x="325" y="502" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">Low nutrient availability</text>
<rect x="580" y="195.0" width="105" height="270.0" fill="#347c86"/>
<text x="632" y="185.0" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">9</text>
<rect x="705" y="165.0" width="105" height="300.0" fill="#a45b27"/>
<text x="757" y="155.0" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">10</text>
<text x="695" y="502" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">High nutrient availability</text>
<rect x="235" y="535" width="25" height="25" rx="0" fill="#347c86" stroke="#347c86" stroke-width="2"/>
<text x="270" y="556" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#23313e">Without symbiosis</text>
<rect x="575" y="535" width="25" height="25" rx="0" fill="#a45b27" stroke="#a45b27" stroke-width="2"/>
<text x="610" y="556" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#23313e">With symbiosis</text>
<text x="55" y="128" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#23313e">Biomass (g)</text>
