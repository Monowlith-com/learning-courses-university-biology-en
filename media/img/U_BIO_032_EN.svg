<text x="407" y="502" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">A</text>
<rect x="455" y="455" width="65" height="70" rx="5" fill="#e4efef" stroke="#347c86" stroke-width="2"/>
<text x="487" y="502" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">A</text>
