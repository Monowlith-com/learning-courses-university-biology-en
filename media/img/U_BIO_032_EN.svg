<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">One codon, three variants</title><desc id="desc">GAA specifies glutamate; GAG is synonymous, GUA specifies valine, and UAA terminates translation in the standard code.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">One codon, three variants</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<text x="65" y="173" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#23313e">Reference</text>
<path d="M 560 165 L 650 165" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="760" y="173" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Glutamate</text>
<rect x="295" y="125" width="65" height="70" rx="5" fill="#e4efef" stroke="#347c86" stroke-width="2"/>
<text x="327" y="172" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">G</text>
<rect x="375" y="125" width="65" height="70" rx="5" fill="#e4efef" stroke="#347c86" stroke-width="2"/>
<text x="407" y="172" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">A</text>
<rect x="455" y="125" width="65" height="70" rx="5" fill="#e4efef" stroke="#347c86" stroke-width="2"/>
<text x="487" y="172" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">A</text>
<text x="65" y="283" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#23313e">Synonymous</text>
<path d="M 560 275 L 650 275" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="760" y="283" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Glutamate</text>
<rect x="295" y="235" width="65" height="70" rx="5" fill="#e4efef" stroke="#347c86" stroke-width="2"/>
<text x="327" y="282" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">G</text>
<rect x="375" y="235" width="65" height="70" rx="5" fill="#e4efef" stroke="#347c86" stroke-width="2"/>
<text x="407" y="282" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">A</text>
<rect x="455" y="235" width="65" height="70" rx="5" fill="#f5e2cf" stroke="#a45b27" stroke-width="2"/>
<text x="487" y="282" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">G</text>
<text x="65" y="393" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#23313e">Missense</text>
<path d="M 560 385 L 650 385" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="760" y="393" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Valine</text>
<rect x="295" y="345" width="65" height="70" rx="5" fill="#e4efef" stroke="#347c86" stroke-width="2"/>
<text x="327" y="392" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">G</text>
<rect x="375" y="345" width="65" height="70" rx="5" fill="#f5e2cf" stroke="#a45b27" stroke-width="2"/>
<text x="407" y="392" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">U</text>
<rect x="455" y="345" width="65" height="70" rx="5" fill="#e4efef" stroke="#347c86" stroke-width="2"/>
<text x="487" y="392" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">A</text>
<text x="65" y="503" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#23313e">Nonsense</text>
