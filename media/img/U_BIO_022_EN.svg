<text x="225" y="295" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">M</text>
<text x="225" y="323" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">4C</text>
