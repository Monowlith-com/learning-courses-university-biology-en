<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Cell cycle and DNA content</title><desc id="desc">Cell cycle of a diploid model cell with G0 branch, DNA contents and three control transitions; phase durations not to scale.</desc>
