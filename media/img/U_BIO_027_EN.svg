<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Coupling in photosynthesis</title><desc id="desc">Functional diagram: light drives PSII and PSI; electron transport and water splitting generate a proton gradient, and NADPH and ATP supply the Calvin cycle.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Coupling in photosynthesis</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<text x="480" y="124" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#23313e">Light</text>
<path d="M 430 134 L 175 178" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 530 134 L 725 178" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="180" width="210" height="66" rx="8" fill="#e6f1e8" stroke="#4c8463" stroke-width="2"/>
<text x="175.0" y="220" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">PSII</text>
<rect x="345" y="180" width="270" height="66" rx="8" fill="#e6f1e8" stroke="#4c8463" stroke-width="2"/>
<text x="480.0" y="220" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Electron transport</text>
<rect x="680" y="180" width="210" height="66" rx="8" fill="#e6f1e8" stroke="#4c8463" stroke-width="2"/>
<text x="785.0" y="220" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">PSI</text>
<path d="M 280 212 L 345 212" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 615 212 L 680 212" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="175" y="284" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">H₂O → O₂</text>
<path d="M 785 246 L 785 315" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="660" y="315" width="250" height="55" rx="8" fill="#edf2f7" stroke="#347c86" stroke-width="2"/>
<text x="785" y="350" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">NADP⁺ → NADPH</text>
<path d="M 480 246 L 480 305" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 175 246 L 175 305" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 175 305 L 480 305" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="315" width="260" height="55" rx="8" fill="#edf2f7" stroke="#347c86" stroke-width="2"/>
<text x="480" y="350" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">H⁺ gradient</text>
<path d="M 480 370 L 480 397" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="397" width="260" height="55" rx="8" fill="#edf2f7" stroke="#347c86" stroke-width="2"/>
<text x="480" y="432" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">ATP synthase</text>
<path d="M 610 424 L 650 424" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="665" y="431" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#23313e">ATP</text>
<path d="M 785 370 L 785 483" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 700 435 L 700 483" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="310" y="483" width="600" height="80" rx="8" fill="#eaf3e9" stroke="#4c8463" stroke-width="2"/>
<text x="610" y="512" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#23313e">Calvin cycle</text>
<text x="610" y="539" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">3 CO₂ → 1 triose phosphate  ·  9 ATP + 6 NADPH</text>
</svg>
