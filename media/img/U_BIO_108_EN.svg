<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Pseudobulk and replication</title><desc id="desc">Three independent donors per group; cells are aggregated per donor, not counted as independent donors.</desc>
