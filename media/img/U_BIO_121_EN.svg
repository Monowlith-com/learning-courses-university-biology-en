<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Spatial autocorrelation</title><desc id="desc">Four sites in two arrangements illustrate similar and alternating neighbouring values.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Spatial autocorrelation</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<text x="480" y="141" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Similar neighbours</text>
<path d="M 197 205 L 313 205" fill="none" stroke="#687681" stroke-width="3"/>
<path d="M 377 205 L 493 205" fill="none" stroke="#687681" stroke-width="3"/>
<path d="M 557 205 L 673 205" fill="none" stroke="#687681" stroke-width="3"/>
<circle cx="165" cy="205" r="32" fill="#347c86"/>
<text x="165" y="213" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#ffffff">2</text>
<text x="165" y="267" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">Site 1</text>
<circle cx="345" cy="205" r="32" fill="#347c86"/>
<text x="345" y="213" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#ffffff">2</text>
<text x="345" y="267" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">Site 2</text>
<circle cx="525" cy="205" r="32" fill="#a45b27"/>
<text x="525" y="213" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#ffffff">6</text>
<text x="525" y="267" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">Site 3</text>
<circle cx="705" cy="205" r="32" fill="#a45b27"/>
<text x="705" y="213" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#ffffff">6</text>
<text x="705" y="267" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">Site 4</text>
<text x="905" y="213" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="end" fill="#23313e">I = 1/3</text>
<text x="480" y="346" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Alternating neighbours</text>
<path d="M 197 410 L 313 410" fill="none" stroke="#687681" stroke-width="3"/>
<path d="M 377 410 L 493 410" fill="none" stroke="#687681" stroke-width="3"/>
<path d="M 557 410 L 673 410" fill="none" stroke="#687681" stroke-width="3"/>
<circle cx="165" cy="410" r="32" fill="#347c86"/>
<text x="165" y="418" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#ffffff">2</text>
<text x="165" y="472" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">Site 1</text>
<circle cx="345" cy="410" r="32" fill="#a45b27"/>
<text x="345" y="418" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#ffffff">6</text>
<text x="345" y="472" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">Site 2</text>
<circle cx="525" cy="410" r="32" fill="#347c86"/>
<text x="525" y="418" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#ffffff">2</text>
<text x="525" y="472" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">Site 3</text>
<circle cx="705" cy="410" r="32" fill="#a45b27"/>
<text x="705" y="418" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#ffffff">6</text>
<text x="705" y="472" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">Site 4</text>
<text x="905" y="418" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="end" fill="#23313e">I = −1</text>
</svg>
