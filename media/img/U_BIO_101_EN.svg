<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Literature selection (simulation)</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="100" y="120" width="380" height="65" rx="8" fill="#eaf3f5" stroke="#347c86" stroke-width="2"/>
<text x="290" y="162" font-family="Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#23313e">32 records</text>
