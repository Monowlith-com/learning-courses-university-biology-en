<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Literature selection (simulation)</title><desc id="desc">Documented selection flow with declining record counts and exclusion reasons.</desc>
