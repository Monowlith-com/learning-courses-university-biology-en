<path d="M 480 152 L 585 152" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="585" y="120" width="310" height="65" rx="8" fill="#fff0df" stroke="#a45b27" stroke-width="2"/>
<text x="740" y="160" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">8 duplicates</text>
<rect x="100" y="240" width="380" height="65" rx="8" fill="#eaf3f5" stroke="#347c86" stroke-width="2"/>
<text x="290" y="282" font-family="Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#23313e">24 unique</text>
<path d="M 290 305 L 290 360" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 480 272 L 585 272" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="585" y="240" width="310" height="65" rx="8" fill="#fff0df" stroke="#a45b27" stroke-width="2"/>
<text x="740" y="280" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">10 excluded</text>
<rect x="100" y="360" width="380" height="65" rx="8" fill="#eaf3f5" stroke="#347c86" stroke-width="2"/>
<text x="290" y="402" font-family="Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#23313e">14 full texts</text>
<path d="M 290 425 L 290 480" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 480 392 L 585 392" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="585" y="360" width="310" height="65" rx="8" fill="#fff0df" stroke="#a45b27" stroke-width="2"/>
<text x="740" y="400" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">6 excluded</text>
<rect x="100" y="480" width="380" height="65" rx="8" fill="#eaf3f5" stroke="#347c86" stroke-width="2"/>
<text x="290" y="522" font-family="Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#23313e">8 included</text>
