<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Geometric scaling</title><desc id="desc">Doubling length increases cross-section fourfold, weight force eightfold and axial stress twofold.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Geometric scaling</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<text x="90" y="130" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#23313e">Factor relative to A</text>
<path d="M 350 480 L 870 480" fill="none" stroke="#687681" stroke-width="2"/>
<text x="330" y="202" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="end" fill="#23313e">Length</text>
<rect x="350" y="170" width="60" height="19" fill="#a5b4b3"/>
<rect x="350" y="193" width="120" height="28" fill="#347c86"/>
<text x="475" y="215" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#23313e">2</text>
<text x="330" y="277" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="end" fill="#23313e">Cross-section</text>
<rect x="350" y="245" width="60" height="19" fill="#a5b4b3"/>
<rect x="350" y="268" width="240" height="28" fill="#347c86"/>
<text x="595" y="290" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#23313e">4</text>
<text x="330" y="352" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="end" fill="#23313e">Mass / weight force</text>
<rect x="350" y="320" width="60" height="19" fill="#a5b4b3"/>
<rect x="350" y="343" width="480" height="28" fill="#347c86"/>
<text x="835" y="365" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#23313e">8</text>
<text x="330" y="427" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="end" fill="#23313e">Axial stress</text>
<rect x="350" y="395" width="60" height="19" fill="#a5b4b3"/>
<rect x="350" y="418" width="120" height="28" fill="#347c86"/>
<text x="475" y="440" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#23313e">2</text>
<text x="350" y="510" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">0</text>
<text x="470" y="510" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">2</text>
<text x="590" y="510" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">4</text>
<text x="710" y="510" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">6</text>
<text x="830" y="510" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">8</text>
<rect x="250" y="545" width="28" height="20" rx="8" fill="#a5b4b3" stroke="none" stroke-width="2"/>
<text x="290" y="562" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#23313e">A: reference</text>
<rect x="530" y="545" width="28" height="20" rx="8" fill="#347c86" stroke="none" stroke-width="2"/>
<text x="570" y="562" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#23313e">B: double length</text>
</svg>
