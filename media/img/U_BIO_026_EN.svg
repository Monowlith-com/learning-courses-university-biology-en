<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Aerobic glucose degradation balance</title><desc id="desc">Balance per glucose: glycolysis, pyruvate oxidation and the citric acid cycle together yield 6 CO₂, 4 ATP/GTP, 10 NADH and 2 FADH₂ equivalents; reduced carriers feed the respiratory chain.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Aerobic glucose degradation balance</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="45" y="112" width="400" height="50" rx="8" fill="#eaf2f2" stroke="#6c7e80" stroke-width="2"/>
<text x="245" y="144" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">Glucose (6 C)</text>
<path d="M 245 162 L 245 180" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="180" width="400" height="50" rx="8" fill="#f5f1e9" stroke="#6c7e80" stroke-width="2"/>
<text x="245" y="212" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">Glycolysis</text>
<path d="M 245 230 L 245 248" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="248" width="400" height="50" rx="8" fill="#eaf2f2" stroke="#6c7e80" stroke-width="2"/>
<text x="245" y="280" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">2 pyruvate (3 C)</text>
<path d="M 245 298 L 245 316" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="316" width="400" height="50" rx="8" fill="#f5f1e9" stroke="#6c7e80" stroke-width="2"/>
<text x="245" y="348" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">Pyruvate oxidation</text>
<path d="M 245 366 L 245 384" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="384" width="400" height="50" rx="8" fill="#eaf2f2" stroke="#6c7e80" stroke-width="2"/>
<text x="245" y="416" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">2 acetyl-CoA (2 C)</text>
<path d="M 245 434 L 245 452" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="452" width="400" height="50" rx="8" fill="#f5f1e9" stroke="#6c7e80" stroke-width="2"/>
<text x="245" y="484" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">Citric acid cycle (2 turns)</text>
<path d="M 445 205 L 505 205" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="518" y="212" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#23313e">2 ATP + 2 NADH</text>
<path d="M 445 341 L 505 341" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="518" y="348" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#23313e">2 CO₂ + 2 NADH</text>
<path d="M 445 477 L 505 477" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="518" y="484" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#23313e">4 CO₂ + 6 NADH</text>
<text x="518" y="509" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#23313e">2 GTP/ATP + 2 FADH₂*</text>
<rect x="520" y="245" width="380" height="66" rx="8" fill="#e6edf4" stroke="#347c86" stroke-width="2"/>
<text x="710" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">10 NADH + 2 FADH₂*</text>
<text x="710" y="296" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Respiratory chain / ATP synthase</text>
<text x="720" y="560" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">* bound FADH₂ equivalent</text>
</svg>
