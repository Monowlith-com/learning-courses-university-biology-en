<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Material balance in the nephron</title><desc id="desc">Arrows distinguish filtration and secretion into the lumen, reabsorption to blood and excretion.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Material balance in the nephron</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="70" y="140" width="250" height="340" rx="8" fill="#f8e5dc" stroke="#6c7e80" stroke-width="2"/>
<rect x="640" y="140" width="250" height="340" rx="8" fill="#e1edf4" stroke="#6c7e80" stroke-width="2"/>
<text x="195" y="180" font-family="Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#23313e">Blood</text>
<text x="765" y="180" font-family="Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#23313e">Tubular lumen</text>
<path d="M 320 250 L 640 250" fill="none" stroke="#347c86" stroke-width="4" marker-end="url(#arrow)"/>
<text x="480" y="236" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">Filtration</text>
<path d="M 640 340 L 320 340" fill="none" stroke="#347c86" stroke-width="4" marker-end="url(#arrow)"/>
<text x="480" y="326" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">Reabsorption</text>
<path d="M 320 425 L 640 425" fill="none" stroke="#347c86" stroke-width="4" marker-end="url(#arrow)"/>
<text x="480" y="411" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">Secretion</text>
<path d="M 765 480 L 765 545" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="750" y="575" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">Excretion</text>
</svg>
