<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">BACI contrast</title><desc id="desc">Model values 12 to 20 in the intervention group and 14 to 17 in the control group yield a contrast of 5.</desc>
