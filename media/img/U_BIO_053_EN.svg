<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Three strategies of CO₂ fixation</title><desc id="desc">Comparison of direct C3 fixation, spatial carbon concentration in typical C4 plants, and temporal separation in CAM.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Three strategies of CO₂ fixation</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<text x="170" y="140" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#23313e">C3</text>
<rect x="40" y="220" width="260" height="70" rx="8" fill="#dcebea" stroke="#347c86" stroke-width="2"/>
<text x="170" y="264" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">CO₂ entry</text>
<path d="M 170 290 L 170 395" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="395" width="260" height="70" rx="8" fill="#e3efd9" stroke="#5b7950" stroke-width="2"/>
<text x="170" y="439" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Calvin cycle</text>
<text x="480" y="140" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#23313e">C4</text>
<rect x="350" y="190" width="260" height="74" rx="8" fill="#dcebea" stroke="#347c86" stroke-width="2"/>
<text x="480" y="236" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Mesophyll</text>
<rect x="350" y="320" width="260" height="74" rx="8" fill="#dcebea" stroke="#347c86" stroke-width="2"/>
<text x="480" y="366" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Bundle sheath</text>
<path d="M 480 264 L 480 320" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 480 394 L 480 435" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="350" y="435" width="260" height="70" rx="8" fill="#e3efd9" stroke="#5b7950" stroke-width="2"/>
<text x="480" y="479" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Calvin cycle</text>
<text x="480" y="550" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Spatial separation</text>
<text x="790" y="140" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" fill="#23313e">CAM</text>
<rect x="660" y="190" width="260" height="74" rx="8" fill="#dcebea" stroke="#347c86" stroke-width="2"/>
<text x="790" y="236" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Night</text>
<rect x="660" y="320" width="260" height="74" rx="8" fill="#dcebea" stroke="#347c86" stroke-width="2"/>
<text x="790" y="366" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Day</text>
<path d="M 790 264 L 790 320" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 790 394 L 790 435" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="660" y="435" width="260" height="70" rx="8" fill="#e3efd9" stroke="#5b7950" stroke-width="2"/>
<text x="790" y="479" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Calvin cycle</text>
<text x="790" y="550" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Temporal separation</text>
</svg>
