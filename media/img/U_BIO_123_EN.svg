<text x="620" y="326" font-family="Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="middle" fill="#347c86">1</text>
<rect x="80" y="371" width="800" height="75" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="165" y="419" font-family="Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#23313e">3</text>
