<text x="485" y="233" font-family="Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="middle" fill="#347c86">1</text>
<text x="620" y="233" font-family="Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="middle" fill="#687681">0</text>
<rect x="80" y="278" width="800" height="75" rx="8" fill="#eaf3f5" stroke="#347c86" stroke-width="2"/>
<text x="165" y="326" font-family="Arial, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" fill="#23313e">2</text>
