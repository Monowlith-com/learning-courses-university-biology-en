<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Regulatory enrichment</title><desc id="desc">Comparison of annotated fractions in background and selection; expected and observed hits.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Regulatory enrichment</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<text x="65" y="193" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#23313e">Background</text>
<rect x="275" y="155" width="600" height="60" fill="#e2e8ea"/>
<rect x="275" y="155" width="120.0" height="60" fill="#347c86"/>
<text x="335.0" y="194" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#ffffff">20%</text>
<text x="635.0" y="194" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">80%</text>
<text x="65" y="323" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#23313e">Selected</text>
<rect x="275" y="285" width="600" height="60" fill="#e2e8ea"/>
<rect x="275" y="285" width="240.0" height="60" fill="#347c86"/>
<text x="395.0" y="324" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#ffffff">40%</text>
<text x="695.0" y="324" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">60%</text>
<rect x="275" y="425" width="270" height="65" rx="8" fill="#eaf3f5" stroke="#347c86" stroke-width="2"/>
<rect x="575" y="425" width="300" height="65" rx="8" fill="#eaf3f5" stroke="#347c86" stroke-width="2"/>
<text x="410" y="466" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">Expected: 10</text>
<text x="725" y="466" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">Observed: 20</text>
<text x="575" y="540" font-family="Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="middle" fill="#23313e">20 / 10 = 2</text>
<rect x="275" y="370" width="25" height="25" fill="#347c86"/>
<text x="310" y="391" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#23313e">Annotated</text>
<rect x="560" y="370" width="25" height="25" fill="#e2e8ea"/>
<text x="595" y="391" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#23313e">Unannotated</text>
</svg>
