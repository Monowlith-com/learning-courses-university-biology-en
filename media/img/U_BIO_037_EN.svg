<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Simplified identification key</title><desc id="desc">Decision tree for four supplied groups; not a phylogenetic tree.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Simplified identification key</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="295.0" y="100" width="370" height="50" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="132" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Typical vascular tissue?</text>
<rect x="60.0" y="237" width="320" height="50" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="220" y="269" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Bryophyte-like</text>
<rect x="530.0" y="237" width="240" height="50" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="650" y="269" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Seeds?</text>
<rect x="220.0" y="380" width="290" height="50" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="365" y="412" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Seedless vascular plant</text>
<rect x="575.0" y="380" width="350" height="50" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="750" y="412" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Ovules enclosed in ovary?</text>
<rect x="515.0" y="510" width="220" height="50" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="625" y="542" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Gymnosperm</text>
<rect x="770.0" y="510" width="170" height="50" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="855" y="542" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Angiosperm</text>
<path d="M 410 150 L 220 237" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300" y="177" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">No</text>
<path d="M 550 150 L 650 237" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="620" y="177" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Yes</text>
<path d="M 595 287 L 365 380" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="455" y="322" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">No</text>
<path d="M 705 287 L 750 380" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="753" y="322" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Yes</text>
<path d="M 690 430 L 625 510" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="630" y="474" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">No</text>
<path d="M 810 430 L 855 510" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="855" y="474" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" fill="#23313e">Yes</text>
</svg>
