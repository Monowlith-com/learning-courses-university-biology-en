<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Simplified carbon budget</title><desc id="desc">Gross primary production 1200, net primary production 700 and net ecosystem production 150 in g C per m² per year.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Simplified carbon budget</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<text x="480" y="122" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">g C / (m² · year)</text>
<rect x="100" y="160" width="180" height="100" rx="8" fill="#dfecef" stroke="#6c7e80" stroke-width="2"/>
<text x="190" y="197" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">GPP</text>
<text x="190" y="235" font-family="Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle" fill="#23313e">1200</text>
<path d="M 280 210 L 390 210" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="390" y="160" width="180" height="100" rx="8" fill="#dfecef" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="197" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">NPP</text>
<text x="480" y="235" font-family="Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle" fill="#23313e">700</text>
<path d="M 570 210 L 680 210" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="680" y="160" width="180" height="100" rx="8" fill="#dfecef" stroke="#6c7e80" stroke-width="2"/>
<text x="770" y="197" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">NEP</text>
<text x="770" y="235" font-family="Arial, sans-serif" font-size="30" font-weight="normal" text-anchor="middle" fill="#23313e">150</text>
<path d="M 335 210 L 335 355" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 625 210 L 625 420" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="90" y="355" width="490" height="60" rx="8" fill="#f4e5d7" stroke="#6c7e80" stroke-width="2"/>
<text x="335" y="392" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">Autotrophic respiration: 500</text>
<rect x="380" y="420" width="490" height="60" rx="8" fill="#f4e5d7" stroke="#6c7e80" stroke-width="2"/>
<text x="625" y="457" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">Heterotrophic respiration: 550</text>
<text x="480" y="550" font-family="Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="middle" fill="#23313e">1200 − 500 − 550 = 150</text>
</svg>
