<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Directions at the replication fork</title><desc id="desc">At a rightward-moving fork, the leading strand is synthesised rightwards and lagging-strand fragments leftwards.</desc>
