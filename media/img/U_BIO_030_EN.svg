<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Alternative splicing</title><desc id="desc">Three exons in pre-mRNA; isoform A retains all three, isoform B skips E2. Both mature transcripts are shown schematically with cap and poly(A).</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Alternative splicing</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<text x="55" y="130" font-family="Arial, sans-serif" font-size="23" font-weight="bold" text-anchor="start" fill="#23313e">Pre-mRNA</text>
<rect x="110" y="160" width="150" height="65" rx="3" fill="#d8e8ed" stroke="#6c7e80" stroke-width="2"/>
<text x="185" y="200" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">E1</text>
<rect x="405" y="160" width="150" height="65" rx="3" fill="#e9d7b9" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="200" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">E2</text>
<rect x="700" y="160" width="150" height="65" rx="3" fill="#d6e8d9" stroke="#6c7e80" stroke-width="2"/>
<text x="775" y="200" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">E3</text>
<path d="M 260 193 L 405 193" fill="none" stroke="#687681" stroke-width="3"/>
<text x="332" y="181" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">Intron</text>
<path d="M 555 193 L 700 193" fill="none" stroke="#687681" stroke-width="3"/>
<text x="627" y="181" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">Intron</text>
<text x="55" y="290" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#23313e">Isoform A</text>
<rect x="110" y="310" width="70" height="60" rx="4" fill="#e5e4f0" stroke="#795594" stroke-width="2"/>
<text x="145" y="345" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">5′</text>
<text x="145" y="394" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">5′ cap</text>
<rect x="180" y="310" width="150" height="60" rx="2" fill="#d8e8ed" stroke="#6c7e80" stroke-width="2"/>
<text x="255" y="347" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">E1</text>
<rect x="330" y="310" width="150" height="60" rx="2" fill="#e9d7b9" stroke="#6c7e80" stroke-width="2"/>
<text x="405" y="347" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">E2</text>
<rect x="480" y="310" width="150" height="60" rx="2" fill="#d6e8d9" stroke="#6c7e80" stroke-width="2"/>
<text x="555" y="347" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">E3</text>
<path d="M 630 340 L 735 340" fill="none" stroke="#687681" stroke-width="3"/>
<text x="692" y="330" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">AAAA…</text>
<text x="692" y="365" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">Poly(A)</text>
<text x="55" y="455" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#23313e">Isoform B</text>
<rect x="110" y="475" width="70" height="60" rx="4" fill="#e5e4f0" stroke="#795594" stroke-width="2"/>
<text x="145" y="510" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">5′</text>
<text x="145" y="559" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">5′ cap</text>
<rect x="180" y="475" width="150" height="60" rx="2" fill="#d8e8ed" stroke="#6c7e80" stroke-width="2"/>
<text x="255" y="512" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">E1</text>
<rect x="330" y="475" width="150" height="60" rx="2" fill="#d6e8d9" stroke="#6c7e80" stroke-width="2"/>
<text x="405" y="512" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">E3</text>
<path d="M 480 505 L 585 505" fill="none" stroke="#687681" stroke-width="3"/>
<text x="542" y="495" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="middle" fill="#23313e">AAAA…</text>
<text x="542" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">Poly(A)</text>
<path d="M 855 193 L 910 193" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 910 193 L 910 505" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 910 340 L 785 340" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 910 505 L 635 505" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
