<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Principal components at r = 0.8</title><desc id="desc">Two orthogonal eigendirections explaining 90 and 10 percent of variance.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Principal components at r = 0.8</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<path d="M 170 330 L 790 330" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 480 540 L 480 120" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="795" y="365" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Feature 1</text>
<text x="498" y="125" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#23313e">Feature 2</text>
<path d="M 310 500 L 650 160" fill="none" stroke="#347c86" stroke-width="4"/>
<path d="M 310 160 L 650 500" fill="none" stroke="#a45b27" stroke-width="4"/>
<text x="670" y="150" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#23313e">PC1: 90%</text>
<text x="670" y="515" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#23313e">PC2: 10%</text>
<circle cx="585" cy="225" r="8" fill="#347c86"/>
<text x="609" y="233" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#23313e">(1, 1)</text>
<circle cx="585" cy="435" r="8" fill="#a45b27"/>
<text x="609" y="421" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#23313e">(1, −1)</text>
<text x="435" y="350" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="end" fill="#23313e">0</text>
</svg>
