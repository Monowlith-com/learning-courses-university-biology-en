<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Static joint model</title><desc id="desc">Schematic lever with opposing forces and moment arms of 3 and 15 cm.</desc>
