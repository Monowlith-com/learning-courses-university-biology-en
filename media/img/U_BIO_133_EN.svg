<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Material accounting</title><desc id="desc">Abstract total mass balance with expected and observed final stock.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Material accounting</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="65" y="135" width="230" height="65" rx="8" fill="#eaf3f5" stroke="#6c7e80" stroke-width="2"/>
<text x="180" y="177" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Initial: 40 kg</text>
<path d="M 180 200 L 480 285" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="365" y="135" width="230" height="65" rx="8" fill="#eaf3f5" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="177" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Input: +70 kg</text>
<path d="M 480 200 L 480 285" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="665" y="135" width="230" height="65" rx="8" fill="#eaf3f5" stroke="#6c7e80" stroke-width="2"/>
<text x="780" y="177" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Output: −55 kg</text>
<path d="M 780 200 L 480 285" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="315" y="290" width="330" height="70" rx="8" fill="#eaf3f5" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="334" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Expected: 55 kg</text>
<path d="M 480 360 L 480 405" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="315" y="410" width="330" height="70" rx="8" fill="#f6eadf" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="454" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Observed: 53 kg</text>
<text x="480" y="535" font-family="Arial, sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#23313e">Residual: −2 kg</text>
</svg>
