<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Randomized block structure</title><desc id="desc">Four sites, each with two conditions and their paired differences.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Randomized block structure</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="75" y="120" width="190" height="350" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="170" y="160" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23313e">Site 1</text>
<text x="170" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">Shaded</text>
<text x="170" y="250" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">4 cm</text>
<text x="170" y="315" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">Unshaded</text>
<text x="170" y="345" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">6 cm</text>
<path d="M 90 370 L 250 370" fill="none" stroke="#687681" stroke-width="2"/>
<text x="170" y="420" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#23313e">-2 cm</text>
<rect x="285" y="120" width="190" height="350" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="380" y="160" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23313e">Site 2</text>
<text x="380" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">Shaded</text>
<text x="380" y="250" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">5 cm</text>
<text x="380" y="315" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">Unshaded</text>
<text x="380" y="345" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">5 cm</text>
<path d="M 300 370 L 460 370" fill="none" stroke="#687681" stroke-width="2"/>
<text x="380" y="420" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#23313e">0 cm</text>
<rect x="495" y="120" width="190" height="350" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="590" y="160" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23313e">Site 3</text>
<text x="590" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">Shaded</text>
<text x="590" y="250" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">3 cm</text>
<text x="590" y="315" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">Unshaded</text>
<text x="590" y="345" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">6 cm</text>
<path d="M 510 370 L 670 370" fill="none" stroke="#687681" stroke-width="2"/>
<text x="590" y="420" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#23313e">-3 cm</text>
<rect x="705" y="120" width="190" height="350" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="800" y="160" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#23313e">Site 4</text>
<text x="800" y="220" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">Shaded</text>
<text x="800" y="250" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">6 cm</text>
<text x="800" y="315" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#23313e">Unshaded</text>
<text x="800" y="345" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">7 cm</text>
<path d="M 720 370 L 880 370" fill="none" stroke="#687681" stroke-width="2"/>
<text x="800" y="420" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#23313e">-1 cm</text>
<text x="480" y="520" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Difference (cm)</text>
</svg>
