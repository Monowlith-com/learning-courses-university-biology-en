<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Genetic differentiation</title><desc id="desc">Two equally weighted populations with frequencies 0.2 and 0.8 and the resulting differentiation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Genetic differentiation</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<text x="280" y="190" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="end" fill="#23313e">Population A</text>
<rect x="310" y="155" width="480" height="60" fill="#dce6e6"/>
<rect x="310" y="155" width="96.0" height="60" fill="#347c86"/>
<text x="805" y="193" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#23313e">0.2</text>
<text x="280" y="305" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="end" fill="#23313e">Population B</text>
<rect x="310" y="270" width="480" height="60" fill="#dce6e6"/>
<rect x="310" y="270" width="384.0" height="60" fill="#347c86"/>
<text x="805" y="308" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start" fill="#23313e">0.8</text>
<text x="310" y="365" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">0</text>
<text x="430.0" y="365" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">0.25</text>
<text x="550.0" y="365" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">0.5</text>
<text x="670.0" y="365" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">0.75</text>
<text x="790" y="365" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">1</text>
<text x="550" y="400" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Allele frequency p</text>
<rect x="70" y="450" width="250" height="70" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="195" y="495" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Hₛ = 0.32</text>
<rect x="350" y="450" width="250" height="70" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="475" y="495" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Hₜ = 0.50</text>
<rect x="630" y="450" width="250" height="70" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="755" y="495" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Fₛₜ = 0.36</text>
</svg>
