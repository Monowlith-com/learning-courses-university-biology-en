<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Allopatric speciation</title><desc id="desc">Schematic spatial separation, divergence and renewed contact with possible gene flow.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Allopatric speciation</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="295" y="110" width="370" height="62" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="149" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Ancestral population</text>
<path d="M 480 172 L 480 205" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="228" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">Spatial separation</text>
<path d="M 440 245 L 245 285" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 520 245 L 715 285" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="115" y="285" width="260" height="65" rx="8" fill="#dfecef" stroke="#6c7e80" stroke-width="2"/>
<text x="245" y="325" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Lineage A</text>
<path d="M 245 350 L 245 430" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="115" y="430" width="260" height="65" rx="8" fill="#dfecef" stroke="#6c7e80" stroke-width="2"/>
<text x="245" y="470" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Lineage A</text>
<rect x="585" y="285" width="260" height="65" rx="8" fill="#f4e5d7" stroke="#6c7e80" stroke-width="2"/>
<text x="715" y="325" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Lineage B</text>
<path d="M 715 350 L 715 430" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="585" y="430" width="260" height="65" rx="8" fill="#f4e5d7" stroke="#6c7e80" stroke-width="2"/>
<text x="715" y="470" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Lineage B</text>
<path d="M480 260 V355" stroke="#6c7e80" stroke-width="3" stroke-dasharray="8 7"/>
<text x="480" y="382" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Divergence</text>
<text x="480" y="425" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Contact</text>
<path d="M 375 463 L 585 463" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 585 483 L 375 483" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="540" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Gene flow?</text>
</svg>
