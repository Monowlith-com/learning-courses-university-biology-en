<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Compositional community data</title><desc id="desc">Two stacked proportion bars show a fourfold change in the A/B ratio.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Compositional community data</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<text x="100" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#23313e">Community 1</text>
<rect x="100" y="180" width="152.0" height="75" fill="#347c86" stroke="white"/>
<text x="176.0" y="225" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="white">A: 20%</text>
<rect x="252.0" y="180" width="304.0" height="75" fill="#a45b27" stroke="white"/>
<text x="404.0" y="225" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="white">B: 40%</text>
<rect x="556.0" y="180" width="304.0" height="75" fill="#c2d3d4" stroke="white"/>
<text x="708.0" y="225" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">C: 40%</text>
<text x="480" y="288" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">A / B = 0.5</text>
<text x="100" y="325" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#23313e">Community 2</text>
<rect x="100" y="345" width="304.0" height="75" fill="#347c86" stroke="white"/>
<text x="252.0" y="390" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="white">A: 40%</text>
<rect x="404.0" y="345" width="152.0" height="75" fill="#a45b27" stroke="white"/>
<text x="480.0" y="390" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="white">B: 20%</text>
<rect x="556.0" y="345" width="304.0" height="75" fill="#c2d3d4" stroke="white"/>
<text x="708.0" y="390" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">C: 40%</text>
<text x="480" y="453" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">A / B = 2</text>
</svg>
