<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Phred quality and error probability</title><desc id="desc">Q10 to Q40 correspond to error probabilities 0.1 to 0.0001.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Phred quality and error probability</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<path d="M 145 480 L 850 480" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 145 480 L 145 165" fill="none" stroke="#687681" stroke-width="2"/>
<text x="45" y="125" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#23313e">Error probability p (log)</text>
<text x="480" y="565" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Phred Q</text>
<path d="M 145 185 L 850 185" fill="none" stroke="#dce2e2" stroke-width="1"/>
<text x="125" y="192" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="end" fill="#23313e">10^-1</text>
<text x="145" y="515" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">10</text>
<circle cx="145" cy="185" r="6" fill="#347c86"/>
<path d="M 145 280 L 850 280" fill="none" stroke="#dce2e2" stroke-width="1"/>
<text x="125" y="287" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="end" fill="#23313e">10^-2</text>
<text x="375" y="515" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">20</text>
<circle cx="375" cy="280" r="6" fill="#347c86"/>
<path d="M 145 375 L 850 375" fill="none" stroke="#dce2e2" stroke-width="1"/>
<text x="125" y="382" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="end" fill="#23313e">10^-3</text>
<text x="605" y="515" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">30</text>
<circle cx="605" cy="375" r="6" fill="#347c86"/>
<path d="M 145 470 L 850 470" fill="none" stroke="#dce2e2" stroke-width="1"/>
<text x="125" y="477" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="end" fill="#23313e">10^-4</text>
<text x="835" y="515" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">40</text>
<circle cx="835" cy="470" r="6" fill="#347c86"/>
<path d="M 145 185 L 835 470" fill="none" stroke="#347c86" stroke-width="4"/>
<text x="410" y="255" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#23313e">Q20: 0.01</text>
<text x="640" y="350" font-family="Arial, sans-serif" font-size="21" font-weight="normal" text-anchor="start" fill="#23313e">Q30: 0.001</text>
</svg>
