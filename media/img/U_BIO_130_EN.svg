<path d="M 495 431.0 L 550 395" fill="none" stroke="#687681" stroke-width="2"/>
<text x="560" y="403" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="start" fill="#23313e">Stock: 20</text>
<rect x="390" y="467.0" width="105" height="18.0" fill="#8d737c" stroke="white"/>
<path d="M 495 476.0 L 550 515" fill="none" stroke="#687681" stroke-width="2"/>
<text x="560" y="523" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="start" fill="#23313e">Residual: 5</text>
