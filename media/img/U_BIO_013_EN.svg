<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Reaction profile and catalysis</title><desc id="desc">Schematic Gibbs energy along the reaction coordinate; identical endpoints with and without a catalyst.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Reaction profile and catalysis</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<path d="M 120 480 L 880 480" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 120 480 L 120 120" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="495" y="550" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">Reaction coordinate</text>
<text x="132" y="115" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="start" fill="#23313e">G</text>
<path d="M 155 310 C 300 310 280 130 480 130 S 660 390 840 390" fill="none" stroke="#a45b27" stroke-width="4"/>
<path d="M 155 310 C 300 310 300 235 480 235 S 660 390 840 390" fill="none" stroke="#347c86" stroke-width="4"/>
<text x="480" y="115" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#a45b27">Without catalyst</text>
<text x="480" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#347c86">With catalyst</text>
<text x="170" y="290" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">A</text>
<text x="830" y="420" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#23313e">B</text>
<path d="M 155 310 L 840 310" fill="none" stroke="#aab0b4" stroke-width="2"/>
<path d="M 840 310 L 840 390" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="865" y="355" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="start" fill="#23313e">ΔG</text>
</svg>
