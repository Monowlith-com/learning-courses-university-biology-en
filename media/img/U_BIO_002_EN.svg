<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Ethical assessment</title><desc id="desc">Scientific benefit and possible burdens are assessed alongside alternatives.</desc>
