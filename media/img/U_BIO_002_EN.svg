<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Ethical assessment</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="305.0" y="122" width="350" height="60" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="160" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Research question</text>
<rect x="60.0" y="244" width="370" height="60" rx="8" fill="#f2f5f4" stroke="#6c7e80" stroke-width="2"/>
<text x="245" y="282" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Scientific benefit</text>
