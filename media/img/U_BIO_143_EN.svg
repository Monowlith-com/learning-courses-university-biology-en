<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Evidence chain and data audit</title><desc id="desc">From unchanged originals through documented code to an output file; a separate audit checks provenance, integrity and reproducibility.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#617482"/></marker></defs><rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" text-anchor="start" font-weight="bold" fill="#23313e">Evidence chain and data audit</text>
<line x1="40" y1="88" x2="920" y2="88" stroke="#aab0b4" stroke-width="2"/>
<rect x="55" y="190" width="230" height="125" rx="12" fill="#e9f3f5" stroke="#617482" stroke-width="2"/>
<text x="170.0" y="246.0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">Original data</text>
<text x="170.0" y="273.0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">SHA-256</text>
<rect x="365" y="190" width="230" height="125" rx="12" fill="#e9f3f5" stroke="#617482" stroke-width="2"/>
<text x="480.0" y="246.0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">Code</text>
<text x="480.0" y="273.0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">Version / parameters</text>
<rect x="675" y="190" width="230" height="125" rx="12" fill="#e9f3f5" stroke="#617482" stroke-width="2"/>
<text x="790.0" y="246.0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">Output</text>
<text x="790.0" y="273.0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">SHA-256</text>
