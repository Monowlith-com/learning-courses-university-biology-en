<text x="480.0" y="474.5" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">Provenance / integrity</text>
<text x="480.0" y="501.5" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">Reproducibility</text>
<line x1="170" y1="320" x2="480" y2="405" stroke="#617482" stroke-width="2" marker-end="url(#a)" stroke-dasharray="9 7"/>
