<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Schematic action potential</title><desc id="desc">Voltage trace with rest, depolarization, repolarization and afterhyperpolarization.</desc>
