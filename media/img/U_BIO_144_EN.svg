<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Scientific argument and evidence</title><desc id="desc">From research problem through design and results to a bounded conclusion; every claim remains connected to its evidence.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#617482"/></marker></defs><rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" text-anchor="start" font-weight="bold" fill="#23313e">Scientific argument and evidence</text>
<line x1="40" y1="88" x2="920" y2="88" stroke="#aab0b4" stroke-width="2"/>
<rect x="55" y="190" width="230" height="125" rx="12" fill="#e9f3f5" stroke="#617482" stroke-width="2"/>
<text x="170.0" y="246.0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">Question</text>
<text x="170.0" y="273.0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">Design</text>
<rect x="365" y="190" width="230" height="125" rx="12" fill="#e9f3f5" stroke="#617482" stroke-width="2"/>
<text x="480.0" y="246.0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">Results</text>
<text x="480.0" y="273.0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">4 cm²</text>
<rect x="675" y="190" width="230" height="125" rx="12" fill="#e9f3f5" stroke="#617482" stroke-width="2"/>
<text x="790.0" y="246.0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">Conclusion</text>
<text x="790.0" y="273.0" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" font-weight="normal" fill="#23313e">1.06–6.94 cm²</text>
<line x1="285" y1="252" x2="360" y2="252" stroke="#617482" stroke-width="3" marker-end="url(#a)"/>
<line x1="595" y1="252" x2="670" y2="252" stroke="#617482" stroke-width="3" marker-end="url(#a)"/>
