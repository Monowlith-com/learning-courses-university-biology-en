<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Thyroid axis as a feedback loop</title><desc id="desc">TRH and TSH stimulate downstream stages; thyroid hormones inhibit both upstream stages.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Thyroid axis as a feedback loop</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="120" y="125" width="340" height="75" rx="8" fill="#e1edf4" stroke="#6c7e80" stroke-width="2"/>
<text x="290" y="172" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Hypothalamus</text>
<rect x="120" y="255" width="340" height="75" rx="8" fill="#e1edf4" stroke="#6c7e80" stroke-width="2"/>
<text x="290" y="302" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Anterior pituitary</text>
<rect x="120" y="385" width="340" height="75" rx="8" fill="#e1edf4" stroke="#6c7e80" stroke-width="2"/>
<text x="290" y="432" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Thyroid</text>
<path d="M 290 200 L 290 255" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="310" y="233" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#23313e">TRH</text>
<path d="M 290 330 L 290 385" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="310" y="363" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" fill="#23313e">TSH</text>
<path d="M 290 460 L 290 525" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<text x="290" y="560" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">T₃ / T₄</text>
<path d="M340 525 H760 V162 H470 M760 292 H470" fill="none" stroke="#a45b27" stroke-width="4"/>
<path d="M 470 145 L 470 179" fill="none" stroke="#a45b27" stroke-width="5"/>
<path d="M 470 275 L 470 309" fill="none" stroke="#a45b27" stroke-width="5"/>
<text x="620" y="385" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">Inhibitory feedback</text>
</svg>
