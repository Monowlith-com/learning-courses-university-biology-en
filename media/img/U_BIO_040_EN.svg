<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Plastid origins</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<ellipse cx="180" cy="245" rx="88" ry="64" fill="#e5eeef" stroke="#347c86" stroke-width="3"/>
<circle cx="160" cy="245" r="19" fill="#b99ccd"/>
