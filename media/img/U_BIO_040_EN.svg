<text x="790" y="328" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">Primary plastid</text>
<text x="330" y="253" font-family="Arial, sans-serif" font-size="32" font-weight="normal" text-anchor="middle" fill="#23313e">+</text>
