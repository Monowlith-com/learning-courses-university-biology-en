<text x="480" y="130" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#23313e">Primary endosymbiosis</text>
<text x="180" y="328" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">Eukaryote</text>
<rect x="430" y="218" width="100" height="54" rx="25" fill="#9fca88" stroke="#598451" stroke-width="2"/>
<text x="480" y="300" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">Cyanobacterium</text>
