<text x="480" y="390" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#23313e">Secondary endosymbiosis</text>
<text x="180" y="550" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="middle" fill="#23313e">New host</text>
<text x="330" y="473" font-family="Arial, sans-serif" font-size="32" font-weight="normal" text-anchor="middle" fill="#23313e">+</text>
<ellipse cx="480" cy="465" rx="70" ry="49" fill="#e5eeef" stroke="#347c86" stroke-width="3"/>
