<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Plastid origins</title><desc id="desc">Schematic incorporation of a cyanobacterium and subsequently a plastid-bearing alga; not to scale.</desc>
