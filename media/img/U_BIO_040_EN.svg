<ellipse cx="180" cy="465" rx="88" ry="64" fill="#e5eeef" stroke="#347c86" stroke-width="3"/>
<circle cx="160" cy="465" r="19" fill="#b99ccd"/>
<ellipse cx="790" cy="465" rx="92" ry="65" fill="#e5eeef" stroke="#347c86" stroke-width="3"/>
