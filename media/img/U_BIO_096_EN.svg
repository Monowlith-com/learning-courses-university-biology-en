<text x="165" y="352" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="end" fill="#23313e">0</text>
<path d="M 185 205 L 840 205" fill="none" stroke="#bfcaca" stroke-width="1"/>
<text x="165" y="212" font-family="Arial, sans-serif" font-size="20" font-weight="normal" text-anchor="end" fill="#23313e">1</text>
<rect x="285" y="205" width="90" height="140" fill="#347c86"/>
<text x="330" y="190" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">1</text>
<text x="330" y="545" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">A</text>
