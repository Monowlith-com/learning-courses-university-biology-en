<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Detection: contingency table</title><desc id="desc">Synthetic contingency table: TP 36, FP 16, FN 4, TN 144.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Detection: contingency table</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<text x="390" y="155" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Reference +</text>
<text x="210" y="275" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="end" fill="#23313e">Test +</text>
<text x="680" y="155" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Reference −</text>
<text x="210" y="435" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="end" fill="#23313e">Test −</text>
<rect x="260" y="180" width="260" height="135" rx="8" fill="#dcefee" stroke="#6c7e80" stroke-width="2"/>
<text x="390" y="227" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">True positive</text>
<text x="390" y="280" font-family="Arial, sans-serif" font-size="38" font-weight="normal" text-anchor="middle" fill="#23313e">36</text>
<rect x="550" y="180" width="260" height="135" rx="8" fill="#f4e5d7" stroke="#6c7e80" stroke-width="2"/>
<text x="680" y="227" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">False positive</text>
<text x="680" y="280" font-family="Arial, sans-serif" font-size="38" font-weight="normal" text-anchor="middle" fill="#23313e">16</text>
<rect x="260" y="340" width="260" height="135" rx="8" fill="#f4e5d7" stroke="#6c7e80" stroke-width="2"/>
<text x="390" y="387" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">False negative</text>
<text x="390" y="440" font-family="Arial, sans-serif" font-size="38" font-weight="normal" text-anchor="middle" fill="#23313e">4</text>
<rect x="550" y="340" width="260" height="135" rx="8" fill="#dcefee" stroke="#6c7e80" stroke-width="2"/>
<text x="680" y="387" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">True negative</text>
<text x="680" y="440" font-family="Arial, sans-serif" font-size="38" font-weight="normal" text-anchor="middle" fill="#23313e">144</text>
<text x="480" y="550" font-family="Arial, sans-serif" font-size="27" font-weight="normal" text-anchor="middle" fill="#23313e">N = 200</text>
</svg>
