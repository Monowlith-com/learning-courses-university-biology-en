<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Water potential and transport</title><desc id="desc">Three compartments with decreasing water potential; water moves towards the leaf, assimilates towards the root in the example.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Water potential and transport</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="60" y="200" width="240" height="120" rx="8" fill="#e7f2ef" stroke="#347c86" stroke-width="2"/>
<text x="180" y="244" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">Soil</text>
<text x="180" y="285" font-family="Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="middle" fill="#23313e">−0.1 MPa</text>
<rect x="360" y="200" width="240" height="120" rx="8" fill="#e7f2ef" stroke="#347c86" stroke-width="2"/>
<text x="480" y="244" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">Root</text>
<text x="480" y="285" font-family="Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="middle" fill="#23313e">−0.3 MPa</text>
<rect x="660" y="200" width="240" height="120" rx="8" fill="#e7f2ef" stroke="#347c86" stroke-width="2"/>
<text x="780" y="244" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">Leaf</text>
<text x="780" y="285" font-family="Arial, sans-serif" font-size="28" font-weight="normal" text-anchor="middle" fill="#23313e">−0.9 MPa</text>
<path d="M 300 260 L 360 260" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 600 260 L 660 260" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 480 370 L 865 370" fill="none" stroke="#347c86" stroke-width="4" marker-end="url(#arrow)"/>
<text x="675" y="410" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">Xylem: water to leaf</text>
<path d="M 790 465 L 480 465" fill="none" stroke="#a45b27" stroke-width="4" marker-end="url(#arrow)"/>
<text x="635" y="510" font-family="Arial, sans-serif" font-size="24" font-weight="normal" text-anchor="middle" fill="#23313e">Phloem: assimilates to sink</text>
</svg>
