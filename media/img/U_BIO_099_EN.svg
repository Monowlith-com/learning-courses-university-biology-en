<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Responsibility-oriented assessment</title><desc id="desc">Documentation and assessment areas with an explicitly open decision rather than automatic approval.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Responsibility-oriented assessment</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="210" y="125" width="540" height="70" rx="8" fill="#eaf3f5" stroke="#347c86" stroke-width="2"/>
<text x="480" y="168" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Objectives and alternatives</text>
<path d="M 480 195 L 480 230" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="210" y="230" width="540" height="70" rx="8" fill="#eaf3f5" stroke="#347c86" stroke-width="2"/>
<text x="480" y="273" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Evidence and uncertainty</text>
<path d="M 480 300 L 480 335" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="210" y="335" width="540" height="70" rx="8" fill="#eaf3f5" stroke="#347c86" stroke-width="2"/>
<text x="480" y="378" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Impacts and oversight</text>
<path d="M 480 405 L 480 440" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="210" y="440" width="540" height="60" rx="8" fill="#fff0df" stroke="#a45b27" stroke-width="2"/>
<text x="480" y="478" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Open or reviewed?</text>
<text x="480" y="550" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#23313e">No automatic approval</text>
</svg>
