<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Seasonal flowering regulation</title><desc id="desc">Simplified scheme: photoperiod activates FT through CONSTANS, vernalization reduces FLC-mediated repression.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Seasonal flowering regulation</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="80" y="130" width="320" height="65" rx="8" fill="#eaf3f5" stroke="#6c7e80" stroke-width="2"/>
<text x="240.0" y="171" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Photoperiod / clock</text>
<rect x="560" y="130" width="320" height="65" rx="8" fill="#eaf3f5" stroke="#6c7e80" stroke-width="2"/>
<text x="720.0" y="171" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Vernalization</text>
<rect x="80" y="245" width="320" height="65" rx="8" fill="#eaf3f5" stroke="#6c7e80" stroke-width="2"/>
<text x="240.0" y="286" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">CONSTANS</text>
<rect x="560" y="245" width="320" height="65" rx="8" fill="#eaf3f5" stroke="#6c7e80" stroke-width="2"/>
<text x="720.0" y="286" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">FLC (repressor)</text>
<rect x="320" y="370" width="320" height="65" rx="8" fill="#eaf3f5" stroke="#6c7e80" stroke-width="2"/>
<text x="480.0" y="411" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">FT in leaf</text>
<rect x="235" y="495" width="490" height="65" rx="8" fill="#eaf3f5" stroke="#6c7e80" stroke-width="2"/>
<text x="480.0" y="536" font-family="Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="middle" fill="#23313e">Flowering programme at meristem</text>
<path d="M 240 195 L 240 245" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 720 195 L 720 235" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 690 235 L 750 235" fill="none" stroke="#a45b27" stroke-width="4"/>
<path d="M 240 310 L 400 370" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 720 310 L 575 361" fill="none" stroke="#687681" stroke-width="2"/>
<path d="M 562 349 L 588 373" fill="none" stroke="#a45b27" stroke-width="4"/>
<path d="M 480 435 L 480 495" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
