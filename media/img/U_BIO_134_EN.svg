<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">Responsible research</title><desc id="desc">Three documented items do not substitute for the missing responsible review.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#687681"/></marker></defs>
<rect width="960" height="600" fill="#fff"/>
<text x="40" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="start" fill="#23313e">Responsible research</text>
<path d="M 40 88 L 920 88" fill="none" stroke="#aab0b4" stroke-width="2"/>
<rect x="100" y="125" width="760" height="63" rx="8" fill="#eaf3f5" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="165" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Purpose and benefit</text>
<text x="135" y="165" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#347c86">OK</text>
<rect x="100" y="213" width="760" height="63" rx="8" fill="#eaf3f5" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="253" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Possible impacts</text>
<text x="135" y="253" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#347c86">OK</text>
<rect x="100" y="301" width="760" height="63" rx="8" fill="#eaf3f5" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="341" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Outstanding uncertainty</text>
<text x="135" y="341" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#347c86">OK</text>
<rect x="100" y="389" width="760" height="63" rx="8" fill="#f6eadf" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="429" font-family="Arial, sans-serif" font-size="25" font-weight="normal" text-anchor="middle" fill="#23313e">Responsible review missing</text>
<text x="135" y="429" font-family="Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="middle" fill="#a45b27">!</text>
<path d="M 480 452 L 480 478" fill="none" stroke="#687681" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="485" width="360" height="65" rx="8" fill="#f6eadf" stroke="#6c7e80" stroke-width="2"/>
<text x="480" y="526" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#23313e">No authorisation</text>
</svg>
